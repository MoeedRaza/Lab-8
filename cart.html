<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Cart | Lootify</title>
</head>

<body>

  <nav class="site-navbar">
    <div class="container nav-shell">
      <a class="navbar-brand" href="index.html"><span class="brand-mark">L</span>LOOT<span
          class="brand-accent">IFY</span></a>
      <div class="nav-links">
        <a class="nav-link " href="index.html">Home</a>
        <a class="nav-link " href="products.html">Marketplace</a>
        <a class="nav-link " href="index.html#reviews">Reviews</a>
        <a class="nav-link active" href="cart.html">Cart</a>
        <a class="btn btn-darkline btn-sm ms-md-2" href="login.html">Login</a>
        <a class="btn btn-accent btn-sm ms-1" href="signup.html">Sign Up</a>
      </div>
    </div>
  </nav>

  <header class="page-header">
    <div class="container">
      <div class="section-label mb-2">YOUR ORDER</div>
      <h1>Shopping Cart</h1>
      <p class="section-copy">Review quantities and pricing before checkout.</p>
    </div>
  </header>
  <main class="section-block">
    <div class="container">
      <div class="row g-4">
        <div class="col-lg-8">
          <div class="checkout-card p-0 overflow-hidden">
            <div class="table-responsive">
              <table class="table cart-table mb-0">
                <thead>
                  <tr>
                    <th class="ps-4">Product</th>
                    <th>Price</th>
                    <th>Qty</th>
                    <th>Total</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="cart-items"></tbody>
              </table>
            </div>
            <div class="d-flex justify-content-between flex-wrap gap-3 p-4 border-top"
              style="border-color:var(--line)!important"><a class="btn btn-darkline" href="products.html">Continue
                Shopping</a><button class="btn btn-darkline" type="button">Update Cart</button></div>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="summary-card">
            <h2 class="summary-title h5">Order Summary</h2>
            <div class="summary-row"><span>Subtotal</span><strong id="cart-subtotal">PKR 0</strong></div>
            <div class="summary-row"><span>Service fee</span><strong id="cart-fee">PKR 0</strong></div>
            <div class="summary-row summary-total"><span>Total</span><strong id="cart-total">PKR 0</strong></div><a
              href="checkout.html" class="btn btn-accent w-100 mt-3">Proceed to Checkout</a>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="store.js"></script>
  <script>
    storeRequest('/cart').then((items) => {
      const body = document.querySelector('#cart-items');
      if (!items.length) {
        body.innerHTML = '<tr><td colspan="5" class="p-4 text-center">Your cart is empty. Browse the marketplace to add products.</td></tr>';
        return;
      }
      body.innerHTML = items.map((item) => `<tr><td class="ps-4"><strong>${item.name}</strong><div class="section-copy small">${item.game}</div></td><td>PKR ${item.price.toLocaleString()}</td><td>${item.quantity}</td><td><strong>PKR ${item.total.toLocaleString()}</strong></td><td></td></tr>`).join('');
      const subtotal = items.reduce((sum, item) => sum + item.total, 0);
      const fee = 100;
      document.querySelector('#cart-subtotal').textContent = `PKR ${subtotal.toLocaleString()}`;
      document.querySelector('#cart-fee').textContent = `PKR ${fee.toLocaleString()}`;
      document.querySelector('#cart-total').textContent = `PKR ${(subtotal + fee).toLocaleString()}`;
    }).catch(() => showStoreMessage('Start the backend to view your cart.', true));
  </script>
</body>

</html>
