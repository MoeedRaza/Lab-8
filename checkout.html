<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Checkout | Lootify</title>
</head>

<body>

  <nav class="site-navbar">
    <div class="container nav-shell">
      <a class="navbar-brand" href="index.html"><span class="brand-mark">L</span>LOOT<span
          class="brand-accent">IFY</span></a>
      <div class="nav-links">
        <a class="nav-link " href="index.html">Home</a>
        <a class="nav-link " href="products.html">Marketplace</a>
        <a class="nav-link " href="index.html#reviews">Reviews</a>
        <a class="nav-link " href="cart.html">Cart</a>
        <a class="btn btn-darkline btn-sm ms-md-2" href="login.html">Login</a>
        <a class="btn btn-accent btn-sm ms-1" href="signup.html">Sign Up</a>
      </div>
    </div>
  </nav>

  <header class="page-header">
    <div class="container">
      <div class="section-label mb-2">FINAL STEP</div>
      <h1>Checkout</h1>
      <p class="section-copy">Review the order and enter the required delivery information.</p>
    </div>
  </header>
  <main class="section-block">
    <div class="container">
      <form id="checkout-form">
        <div class="row g-4">
          <div class="col-lg-8">
            <div class="checkout-card">
              <h2 class="h5 fw-bold mb-4">Contact Information</h2>
              <div class="row g-3">
                <div class="col-md-6"><label class="form-label">First name</label><input class="form-control" required>
                </div>
                <div class="col-md-6"><label class="form-label">Last name</label><input class="form-control" required>
                </div>
                <div class="col-md-6"><label class="form-label">Email</label><input type="email" class="form-control"
                    required></div>
                <div class="col-md-6"><label class="form-label">Lootify username</label><input class="form-control"
                    required></div>
              </div>
              <hr style="border-color:var(--line)" class="my-4">
              <h2 class="h5 fw-bold mb-4">Game Account</h2>
              <div class="row g-3">
                <div class="col-md-6"><label class="form-label">Platform</label><select class="form-select">
                    <option>PC</option>
                    <option>PlayStation</option>
                    <option>Xbox</option>
                  </select></div>
                <div class="col-md-6"><label class="form-label">Region</label><select class="form-select">
                    <option>Asia</option>
                    <option>Middle East</option>
                    <option>Europe</option>
                    <option>North America</option>
                  </select></div>
                <div class="col-12"><label class="form-label">Public game account ID</label><input class="form-control"
                    placeholder="Do not enter your password"></div>
              </div>
            </div>
          </div>
          <div class="col-lg-4">
            <div class="summary-card">
              <h2 class="summary-title h5">Order Review</h2>
              <div id="checkout-items"></div>
              <div class="summary-row"><span>Service fee</span><strong id="checkout-fee">PKR 0</strong></div>
              <div class="summary-row summary-total"><span>Total</span><strong id="checkout-total">PKR 0</strong></div><button
                class="btn btn-accent w-100 mt-3">Submit Order</button><a href="cart.html"
                class="btn btn-darkline w-100 mt-2">Edit Cart</a>
            </div>
          </div>
        </div>
      </form>
    </div>
  </main>
  <script src="store.js"></script>
  <script>
    storeRequest('/cart').then((items) => {
      const summary = document.querySelector('#checkout-items');
      if (!items.length) {
        summary.innerHTML = '<div class="summary-row"><span>Your cart is empty</span><strong>PKR 0</strong></div>';
        return;
      }
      summary.innerHTML = items.map((item) => `<div class="summary-row"><span>${item.name} × ${item.quantity}</span><strong>PKR ${item.total.toLocaleString()}</strong></div>`).join('');
      const subtotal = items.reduce((sum, item) => sum + item.total, 0);
      document.querySelector('#checkout-items').insertAdjacentHTML('beforeend', `<div class="summary-row"><span>Subtotal</span><strong>PKR ${subtotal.toLocaleString()}</strong></div>`);
      document.querySelector('#checkout-fee').textContent = 'PKR 100';
      document.querySelector('#checkout-total').textContent = `PKR ${(subtotal + 100).toLocaleString()}`;
    }).catch(() => showStoreMessage('Start the backend to load your order summary.', true));

    document.querySelector('#checkout-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const fields = event.currentTarget.querySelectorAll('input, select');
      try {
        const items = await storeRequest('/cart');
        if (!items.length) {
          showStoreMessage('Your cart is empty. Add a product before submitting an order.', true);
          return;
        }
        const subtotal = items.reduce((sum, item) => sum + item.total, 0);
        const order = await storeRequest('/orders', {
          method: 'POST',
          body: JSON.stringify({
            customer: {
              firstName: fields[0].value,
              lastName: fields[1].value,
              email: fields[2].value,
              lootifyUsername: fields[3].value,
              platform: fields[4].value,
              region: fields[5].value,
              gameAccountId: fields[6].value,
            },
            items,
            subtotal,
            serviceFee: 100,
            total: subtotal + 100,
          }),
        });
        showStoreMessage(`Order #${order.id} submitted successfully.`);
        event.currentTarget.reset();
      } catch (error) {
        showStoreMessage('Could not submit the order. Check that the backend is running and your cart has items.', true);
      }
    });
  </script>
</body>

</html>
